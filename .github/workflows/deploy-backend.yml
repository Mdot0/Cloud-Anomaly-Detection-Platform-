name: Deploy Azure Functions (Backend)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "ERROR: backend/requirements.txt not found"
            exit 1
          fi

      # Optional: quick sanity check so the deploy doesn't "succeed" with a broken package
      - name: Validate Azure Functions structure
        working-directory: backend
        run: |
          test -f host.json || (echo "ERROR: backend/host.json missing" && exit 1)
          test -f function_app.py || (echo "ERROR: backend/function_app.py missing" && exit 1)

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: cloudguard-backend-new-e7hechafgxafhsax
          package: backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
