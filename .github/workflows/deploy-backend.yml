name: Deploy Azure Functions

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_run:
    workflows: ["Terraform Apply"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Generate backend/requirements.txt from pyproject.toml/uv.lock
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv export --format requirements-txt --no-hashes --no-header --no-annotate -o backend/requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login
        run: az account show -o table

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Validate Functions files
        run: |
          test -f backend/host.json || (echo "ERROR: backend/host.json missing" && exit 1)
          test -f backend/function_app.py || (echo "ERROR: backend/function_app.py missing" && exit 1)
          test -f backend/requirements.txt || (echo "ERROR: backend/requirements.txt missing" && exit 1)

      - name: Install Azure Functions Core Tools v4
        run: |
          npm i -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Publish
        working-directory: backend
        run: |
          func azure functionapp publish cloudguard-upload --python --build remote
