name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_run:
    workflows: ["Terraform Apply"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build_and_deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Look up Function App hostname
        id: func_host
        run: |
          HOST=$(az functionapp show --name cloudguard-upload --resource-group cloudguard-group --query defaultHostName -o tsv)
          echo "hostname=$HOST" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (inject VITE_API_BASE)
        working-directory: frontend
        env:
          VITE_API_BASE: https://${{ steps.func_host.outputs.hostname }}
        run: npm run build

      - name: Look up Static Web App deployment token
        id: swa_token
        run: |
          TOKEN=$(az staticwebapp secrets list --name cloudguard-swa --resource-group cloudguard-group --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy prebuilt dist
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          api_location: ""
          output_location: ""
