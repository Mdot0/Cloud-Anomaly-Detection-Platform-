name: Deploy Azure Functions (Backend) - func publish

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/main_cloudguard-backend-new.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_033334472A7F49C881A7081C2C95CF0B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_47B3FF8906C2400DBB120ACAB44DAB2E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D6D502B93A214FE9A4D2615E680689C2 }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Functions files
        run: |
          test -f backend/host.json || (echo "ERROR: backend/host.json missing" && exit 1)
          test -f backend/function_app.py || (echo "ERROR: backend/function_app.py missing" && exit 1)
          test -f backend/requirements.txt || (echo "ERROR: backend/requirements.txt missing" && exit 1)

      - name: Install Azure Functions Core Tools v4
        run: |
          npm i -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Publish (same as your local working deploy)
        working-directory: backend
        run: |
          func azure functionapp publish cloudguard-backend-new --python --build remote
