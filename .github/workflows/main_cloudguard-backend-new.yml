name: Deploy Azure Functions (Backend)

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.11"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Optional: quick sanity check so we don't deploy junk
      - name: Validate Functions project files
        run: |
          test -f backend/host.json || (echo "ERROR: backend/host.json missing" && exit 1)
          test -f backend/function_app.py || (echo "ERROR: backend/function_app.py missing" && exit 1)
          test -f backend/requirements.txt || (echo "ERROR: backend/requirements.txt missing" && exit 1)

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_033334472A7F49C881A7081C2C95CF0B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_47B3FF8906C2400DBB120ACAB44DAB2E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D6D502B93A214FE9A4D2615E680689C2 }}

      - name: Deploy to Azure Functions (build on deploy)
        uses: Azure/functions-action@v1
        with:
          app-name: cloudguard-backend-new
          package: backend
          scm-do-build-during-deployment: true
          enable-oryx-build: true
