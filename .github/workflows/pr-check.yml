name: PR Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - "frontend/**"
      - "*.tf"
      - ".github/workflows/pr-check.yml"

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (typecheck + vite build)
        working-directory: frontend
        env:
          # Placeholder only — this is a build/typecheck gate, not a deploy. api.ts requires
          # this var to be set at build time or it throws at import.
          VITE_API_BASE: https://placeholder.invalid
        run: npm run build

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"

      - name: terraform fmt (check only)
        run: terraform fmt -check -recursive -diff

      - name: terraform init (providers only, no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
